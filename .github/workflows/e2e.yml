on:
  push:
    branches:
      - main
    paths:
      - 'R/**'
      - 'inst/**'
      - 'tests/e2e/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - '.github/workflows/e2e.yml'
  # No path filter on PRs: if the e2e checks are made required on main, a PR that touches none of the paths
  # above would get no e2e checks at all and wait for them forever.
  pull_request:

name: e2e

permissions:
  contents: read

jobs:
  # The shared workflow from @appsilon/shiny-playwright runs the tests on Shiny 1.7.5.1 (the oldest version we
  # test) and on the newest Shiny on Posit Package Manager, which can lag CRAN. The checks are
  # `e2e / Shiny latest` and `e2e / Shiny 1.7.5.1`.
  # Upgrade the tag here together with the package version in tests/e2e/package.json.
  e2e:
    uses: Appsilon/shiny.playwright/.github/workflows/e2e.yml@v0.2.0
    with:
      shiny-oldest: '1.7.5.1'
